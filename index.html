<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duck's Magical Grape Quest - Part 3</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: black;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #game {
        width: 100vw;
        height: 100vh;
        position: relative;
        background: black;
    }

    canvas {
        display: block;
        margin: auto;
        background: #222;
    }

    /* HUD */

    #hud {
        position: absolute;
        top: 15px;
        left: 15px;
        color: white;
        font-size: 20px;
        background: rgba(0,0,0,0.65);
        padding: 12px 18px;
        border-radius: 12px;
        z-index: 10;
    }

    /* DIALOGUE */

    #dialogueBox {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 1000px;
        background: rgba(0,0,0,0.85);
        border: 3px solid white;
        border-radius: 15px;
        color: white;
        padding: 18px;
        z-index: 20;
        display: none;
    }

    #speaker {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    #dialogue {
        font-size: 20px;
        line-height: 1.4;
    }

    #continueButton {
        float: right;
        margin-top: 12px;
        padding: 10px 22px;
        border: none;
        border-radius: 10px;
        background: #7c4dff;
        color: white;
        font-size: 17px;
        cursor: pointer;
    }

    #continueButton:hover {
        background: #9b75ff;
    }

    /* OVERLAYS */

    .overlay {
        position: absolute;
        inset: 0;
        background: black;
        color: white;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
        z-index: 100;
    }

    .overlay h1 {
        font-size: 75px;
        margin: 10px;
    }

    .overlay p {
        font-size: 25px;
    }

    /* AREA TITLE */

    #areaTransition {
        position: absolute;
        inset: 0;
        background: black;
        color: white;
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 90;
    }

    #areaTitle {
        font-size: 75px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div id="game">

    <canvas id="canvas" width="1100" height="720"></canvas>

    <div id="hud">
        🦆 Duck HP: <span id="hp">100</span><br>
        🍇 Grapes: <span id="grapes">0</span> / 3<br>
        🎯 Objective: Find the magical grapes
    </div>

    <div id="dialogueBox">

        <div id="speaker"></div>

        <div id="dialogue"></div>

        <button id="continueButton">Continue</button>

    </div>


    <div id="areaTransition">
        <div id="areaTitle">Desert</div>
    </div>


    <div id="part4" class="overlay">

        <h1>PART 4 YUMMY</h1>

        <p>The adventure continues...</p>

    </div>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const hpText = document.getElementById("hp");
const grapeText = document.getElementById("grapes");

const dialogueBox = document.getElementById("dialogueBox");
const speakerText = document.getElementById("speaker");
const dialogueText = document.getElementById("dialogue");
const continueButton = document.getElementById("continueButton");

const areaTransition = document.getElementById("areaTransition");
const areaTitle = document.getElementById("areaTitle");

const part4 = document.getElementById("part4");


/* =========================
   GAME VARIABLES
========================= */

let area = "town";

let grapes = 0;

let hp = 100;

let keys = {};

let gameStarted = false;

let dialogueActive = false;

let dialogueQueue = [];

let currentDialogue = 0;


/* =========================
   DUCK
========================= */

let duck = {
    x: 550,
    y: 360,
    size: 35,
    speed: 4
};


/* =========================
   WIZARD
========================= */

let wizard = {
    x: 500,
    y: 430,
    size: 35
};


/* =========================
   OLD MAN
========================= */

let oldMan = {
    x: 450,
    y: 470,
    size: 35
};


/* =========================
   GRAPES
========================= */

let desertGrape = {
    x: 850,
    y: 300,
    found: false
};

let forestGrape = {
    x: 800,
    y: 500,
    found: false
};

let caveGrape = {
    x: 850,
    y: 350,
    found: false
};


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

});

document.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

});


/* =========================
   DRAW DUCK
========================= */

function drawDuck() {

    ctx.font = "45px Arial";

    ctx.fillText("🦆", duck.x - 23, duck.y + 15);

}


/* =========================
   DRAW WIZARD
========================= */

function drawWizard() {

    ctx.font = "45px Arial";

    ctx.fillText("🧙‍♂️", wizard.x - 23, wizard.y + 15);

}


/* =========================
   DRAW OLD MAN
========================= */

function drawOldMan() {

    ctx.font = "45px Arial";

    ctx.fillText("👴", oldMan.x - 23, oldMan.y + 15);

}


/* =========================
   DRAW GRAPE
========================= */

function drawGrape(x, y) {

    ctx.font = "55px Arial";

    ctx.fillText("🍇", x - 25, y + 20);

}


/* =========================
   DRAW WORLD
========================= */

function drawWorld() {

    if (area === "town") {

        ctx.fillStyle = "#77c7ff";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle = "#75b84c";
        ctx.fillRect(0,480,canvas.width,240);

        // Town houses

        ctx.fillStyle = "#d94f4f";

        ctx.fillRect(100,280,180,200);
        ctx.fillRect(820,280,180,200);

        ctx.fillStyle = "#8b4513";

        ctx.fillRect(160,390,60,90);
        ctx.fillRect(880,390,60,90);

        ctx.fillStyle = "#333";

        ctx.font = "35px Arial";
        ctx.fillText("GRAPE TOWN",430,100);

    }


    if (area === "desert") {

        ctx.fillStyle = "#e6b84c";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // Sand dunes

        ctx.fillStyle = "#d69d32";

        for(let i=0;i<7;i++) {

            ctx.beginPath();

            ctx.arc(
                i * 190,
                650,
                170,
                Math.PI,
                Math.PI * 2
            );

            ctx.fill();

        }

        ctx.fillStyle = "#a66a20";

        ctx.font = "35px Arial";

        ctx.fillText("DESERT",480,80);

        if(!desertGrape.found) {

            drawGrape(
                desertGrape.x,
                desertGrape.y
            );

        }

    }


    if (area === "forest") {

        ctx.fillStyle = "#153d20";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // Trees

        for(let i=0;i<15;i++) {

            let x = (i * 83) % 1050 + 25;
            let y = (i * 137) % 600 + 70;

            ctx.font = "70px Arial";
            ctx.fillText("🌲",x,y);

        }

        ctx.fillStyle = "white";

        ctx.font = "35px Arial";

        ctx.fillText("SECRET FOREST",420,70);

        if(!forestGrape.found) {

            drawGrape(
                forestGrape.x,
                forestGrape.y
            );

        }

    }


    if (area === "cave") {

        ctx.fillStyle = "#16161c";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // Cave rocks

        ctx.font = "80px Arial";

        ctx.fillText("🪨",100,150);
        ctx.fillText("🪨",900,180);
        ctx.fillText("🪨",200,620);
        ctx.fillText("🪨",800,620);

        ctx.fillStyle = "#8f8fff";

        ctx.font = "35px Arial";

        ctx.fillText("UNKNOWN LOCATION",390,80);

        if(!caveGrape.found) {

            drawGrape(
                caveGrape.x,
                caveGrape.y
            );

        }

    }

}


/* =========================
   MOVEMENT
========================= */

function moveDuck() {

    if(dialogueActive) return;

    if(keys["w"] || keys["arrowup"]) {
        duck.y -= duck.speed;
    }

    if(keys["s"] || keys["arrowdown"]) {
        duck.y += duck.speed;
    }

    if(keys["a"] || keys["arrowleft"]) {
        duck.x -= duck.speed;
    }

    if(keys["d"] || keys["arrowright"]) {
        duck.x += duck.speed;
    }


    // Keep duck inside screen

    duck.x = Math.max(30, Math.min(canvas.width - 30, duck.x));

    duck.y = Math.max(80, Math.min(canvas.height - 40, duck.y));

}


/* =========================
   FOLLOW CHARACTERS
========================= */

function followCharacters() {

    wizard.x += (duck.x - 70 - wizard.x) * 0.03;
    wizard.y += (duck.y + 60 - wizard.y) * 0.03;

    oldMan.x += (wizard.x - 60 - oldMan.x) * 0.03;
    oldMan.y += (wizard.y + 60 - oldMan.y) * 0.03;

}


/* =========================
   DISTANCE
========================= */

function distance(a,b) {

    return Math.sqrt(
        Math.pow(a.x-b.x,2) +
        Math.pow(a.y-b.y,2)
    );

}


/* =========================
   GRAPE CHECK
========================= */

function checkGrapes() {

    if(area === "desert" && !desertGrape.found) {

        if(distance(duck,desertGrape) < 60) {

            desertGrape.found = true;

            grapes++;

            grapeText.innerText = grapes;

            showDialogue(
                "Duck",
                "QUACK! I found a magical grape!"
            );

            setTimeout(() => {

                startForest();

            }, 1800);

        }

    }


    if(area === "forest" && !forestGrape.found) {

        if(distance(duck,forestGrape) < 60) {

            forestGrape.found = true;

            grapes++;

            grapeText.innerText = grapes;

            showDialogue(
                "Duck",
                "QUACK! Another magical grape!"
            );

            setTimeout(() => {

                wizardFindsLocation();

            }, 1800);

        }

    }


    if(area === "cave" && !caveGrape.found) {

        if(distance(duck,caveGrape) < 60) {

            caveGrape.found = true;

            grapes++;

            grapeText.innerText = grapes;

            showDialogue(
                "Duck",
                "I FOUND THE LAST GRAPE!!! 🍇"
            );

            setTimeout(() => {

                finishPart3();

            }, 2500);

        }

    }

}


/* =========================
   DIALOGUE
========================= */

function showDialogue(speaker,text) {

    dialogueActive = true;

    dialogueBox.style.display = "block";

    speakerText.innerText = speaker;

    dialogueText.innerText = text;

}


/* =========================
   CLOSE DIALOGUE
========================= */

continueButton.onclick = function() {

    dialogueBox.style.display = "none";

    dialogueActive = false;

};


/* =========================
   TRANSITION
========================= */

function transition(title,nextFunction) {

    dialogueBox.style.display = "none";

    dialogueActive = false;

    areaTitle.innerText = title;

    areaTransition.style.display = "flex";


    setTimeout(() => {

        areaTransition.style.display = "none";

        nextFunction();

    },3000);

}


/* =========================
   START DESERT
========================= */

function startDesert() {

    area = "desert";

    duck.x = 150;
    duck.y = 400;

    wizard.x = 100;
    wizard.y = 450;

    oldMan.x = 60;
    oldMan.y = 500;

}


/* =========================
   START FOREST
========================= */

function startForest() {

    transition(
        "Secret Forest",
        () => {

            area = "forest";

            duck.x = 150;
            duck.y = 400;

            wizard.x = 100;
            wizard.y = 450;

            oldMan.x = 60;
            oldMan.y = 500;

            showDialogue(
                "Wizard",
                "I have teleported us to the Secret Forest. The second magical grape must be somewhere here."
            );

        }
    );

}


/* =========================
   WIZARD DETECTS CAVE
========================= */

function wizardFindsLocation() {

    showDialogue(
        "Wizard",
        "I have detected the unknown location of the last grape."
    );

    setTimeout(() => {

        transition(
            "Unknown Location",
            () => {

                area = "cave";

                duck.x = 150;
                duck.y = 400;

                wizard.x = 100;
                wizard.y = 450;

                oldMan.x = 60;
                oldMan.y = 500;

            }
        );

    },2000);

}


/* =========================
   START GAME
========================= */

function startGame() {

    showDialogue(
        "Wizard",
        "Welcome to Grape Town! There are many magical grapes here and in the nearby forest."
    );

    setTimeout(() => {

        showDialogue(
            "Townsperson",
            "The mysterious person stole almost all of them! Only three magical grapes remain."
        );

    },2500);

    setTimeout(() => {

        showDialogue(
            "Townsperson",
            "One is in the desert, one is in the Secret Forest, and the last one is somewhere unknown."
        );

    },5000);

    setTimeout(() => {

        showDialogue(
            "Old Man",
            "Then let's find them before the mysterious person does."
        );

    },7500);

    setTimeout(() => {

        transition(
            "Desert",
            startDesert
        );

    },10000);

}


/* =========================
   END
========================= */

function finishPart3() {

    areaTransition.style.display = "flex";

    areaTitle.innerText = "";

    setTimeout(() => {

        areaTransition.style.display = "none";

        part4.style.display = "flex";

    },3000);

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    moveDuck();

    followCharacters();

    drawWorld();

    drawWizard();

    drawOldMan();

    drawDuck();

    checkGrapes();

    requestAnimationFrame(gameLoop);

}


/* =========================
   BEGIN
========================= */

startGame();

gameLoop();

</script>

</body>
</html>
